# Reusable Static Site Nginx configuration snippet
# Place at /etc/nginx/snippets/static.conf

index index.html index.htm;

location = /favicon.ico {
    log_not_found off;
    access_log off;
}

location = /robots.txt {
    allow all;
    log_not_found off;
    access_log off;
}

# Block access to hidden files and version control
location ~ (^|/)\. {
    return 403;
}

# Block direct access to source or build metadata if deployed
location ~* \.(env|git|lock|yml|yaml|json|md|log)$ {
    return 404;
}

# Default routing for static assets and HTML pages
# Tries exact file match, directory index, then .html extension fallback
location / {
    try_files $uri $uri/ $uri.html =404;
}

# Single Page Application (SPA) routing fallback:
# If your static site is an SPA (e.g. React, Vue, Svelte) requiring
# client-side routing, comment out the `location /` block above and uncomment this:
# location / {
#     try_files $uri $uri/ /index.html;
# }

# Custom 404 error page (served from document root if 404.html exists)
error_page 404 /404.html;
location = /404.html {
    internal;
}

# Cache static assets with long max-age (hashed or versioned assets)
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot|otf|mp4|webm|wasm)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    log_not_found off;
    access_log off;
}

# Ensure HTML files are not cached by browsers so deployments take effect immediately
location ~* \.html?$ {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

# Gzip compression for static files
gzip on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm;
gzip_vary on;

# Baseline security headers
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
