# Reusable Drupal Nginx configuration snippet
# Place at /etc/nginx/snippets/drupal.conf

index index.php index.html;

location = /favicon.ico {
    log_not_found off;
    access_log off;
}

location = /robots.txt {
    allow all;
    log_not_found off;
    access_log off;
}

# Block access to hidden files and version control
location ~ (^|/)\. {
    return 403;
}

# Block direct access to vendor or sensitive codebase paths
location ~* ^/(vendor|config)/ {
    return 404;
}

location / {
    try_files $uri /index.php?$query_string;
}

location @rewrite {
    rewrite ^ /index.php;
}

# Handle Drupal image styles (must use ^~ so it takes priority over static and files rules)
location ^~ /sites/default/files/styles/ {
    location ~* \.(php[0-9]*|phtml|phar|pl|py|jsp|asp|sh|cgi)$ {
        return 403;
    }
    try_files $uri @rewrite;
}

# Don't allow direct execution of PHP or script files in user-uploaded files
location ^~ /sites/default/files/ {
    location ~* \.(php[0-9]*|phtml|phar|pl|py|jsp|asp|sh|cgi|inc|module|engine|install|theme)$ {
        return 403;
    }
    try_files $uri =404;
}

# Pass PHP scripts to FastCGI
location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $request_filename;
    fastcgi_intercept_errors on;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    fastcgi_read_timeout 300;
    fastcgi_buffer_size 128k;
    fastcgi_buffers 4 256k;
    fastcgi_busy_buffers_size 256k;
}

# Cache static assets
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
    expires max;
    log_not_found off;
    access_log off;
}

gzip on;
gzip_proxied any;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
gzip_vary on;

# Baseline security headers
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
